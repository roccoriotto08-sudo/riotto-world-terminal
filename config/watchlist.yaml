# Portfolio overlay. [TICKERS] placeholder -> example book below; replace with yours.
# geographies: ISO3 countries whose events/alerts can affect the name
# commodities: KPI/asset ids (WTI, BRENT, HH, TTF, JKM, COPPER, GOLD, URANIUM) or
#              commodity tags (OIL, GAS, LNG, COPPER, URANIUM, SEMIS, GRAINS)
# chokepoints: chokepoint ids from config/reference/chokepoints.yaml
# market: symbol per provider for live prices (optional)
# news_aliases: company names that tag a headline with this ticker (the ticker itself also matches)

