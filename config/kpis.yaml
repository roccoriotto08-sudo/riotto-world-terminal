  - { id: URANIUM, label: URANIUM,   entity: URANIUM, metric: price, unit: USD/lb,    change: pct, sources: [FRED], hub: [-106.3, 52.1] }
  - { id: WTI,     label: WTI,       entity: WTI,     metric: price, unit: USD/bbl,   change: pct, sources: [MARKET, FRED], hub: [-96.77, 35.98] }
  - { id: BRENT,   label: BRENT,     entity: BRENT,   metric: price, unit: USD/bbl,   change: pct, sources: [MARKET, FRED], hub: [1.5, 58.5] }
  - { id: TTF,     label: TTF,       entity: TTF,     metric: price, unit: USD/MMBtu, change: pct, sources: [MARKET, FRED], hub: [5.3, 52.4] }
  - { id: COPPER,  label: COPPER,    entity: COPPER,  metric: price, unit: USD/t,     change: pct, sources: [MARKET, FRED], hub: [-0.09, 51.51] }
  - { id: GOLD,    label: GOLD,      entity: GOLD,    metric: price, unit: USD/ozt,   change: pct, sources: [MARKET], hub: [-74.0, 40.7] }
